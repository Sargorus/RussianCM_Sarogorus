  name: car crate
  description: A passenger car, packed for transport. Wheels included.
  components:
  - type: Item
    size: Huge
  - type: AU14DeployBox
    anchor: false
    distance: 3.3
    entries:
    - prototype: AU14VehicleCivCar
      install:
