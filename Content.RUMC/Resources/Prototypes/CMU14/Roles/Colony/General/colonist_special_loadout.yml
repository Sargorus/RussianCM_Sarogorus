# Base for boxes that unpack a machine or vehicle when used in hand.
- type: entity
  abstract: true
  parent: BaseItem
  id: AU14DeployBoxBase
  name: supply box
  description: Packed for transport - use it in your hand to unpack what's inside.
  components:
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi
    state: box
  - type: AU14DeployBox
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: AU14DeployBoxBase
  id: AU14BoxMicrowave
  name: microwave crate
  description: A microwave oven, packed for transport.
  components:
  - type: Item
    size: Large
  - type: AU14DeployBox
    anchor: true
    distance: 2
    entries:
    - prototype: CMMicrowave

- type: entity
  parent: AU14DeployBoxBase
  id: AU14BoxVendorDinnerware
  name: dinnerware vendor crate
  description: A dinnerware vending machine, packed for transport.
  components:
  - type: Item
    size: Large
  - type: AU14DeployBox
    anchor: true
    distance: 2
    entries:
    - prototype: CMVendorDinnerware

- type: entity
  parent: AU14DeployBoxBase
  id: AU14BoxVendorIngredients
  name: galley vendor crate
  description: A galley ingredients vending machine, packed for transport.
  components:
  - type: Item
    size: Large
  - type: AU14DeployBox
    anchor: true
    distance: 2
    entries:
    - prototype: CMVendorIngredients

- type: entity
  parent: AU14DeployBoxBase
  id: AU14BoxVehicleBlueTruck
  name: blue van crate
  description: A blue van, packed for transport. Wheels included.
  components:
  - type: Item
    size: Huge
  - type: AU14DeployBox
    anchor: false
    distance: 3
    entries:
    - prototype: AU14VehicleCivBlueTruck
      install:
        wheel-1: RMCVanWheel

- type: entity
  parent: AU14DeployBoxBase
  id: AU14BoxVehicleTruck
  name: truck crate
  description: A civilian truck, packed for transport. Wheels included.
  components:
  - type: Item
    size: Huge
  - type: AU14DeployBox
    anchor: false
    distance: 3
    entries:
