# Colonist skills: each category is a group, each option is a loadout that sets skills; only one option per category.

- type: loadoutGroup
  id: AU14ColonistPerkGroupFirearms
  name: loadout-group-au14-colonist-perk-firearms
  hidden: true
  minLimit: 0
  maxLimit: 1
  loadouts: [ AU14ColonistPerkFirearmsCourse, AU14ColonistPerkHunter, AU14ColonistPerkMarksman ]

- type: loadout
  id: AU14ColonistPerkFirearmsCourse
  cost: 4
  effects:
  - !type:SetSkillLoadoutEffect
    skill: RMCSkillFirearms
    level: 1

- type: loadout
  id: AU14ColonistPerkHunter
  cost: 10
  effects:
  - !type:SetSkillLoadoutEffect
    skill: RMCSkillFirearms
    level: 2
  - !type:SetSkillLoadoutEffect
    skill: RMCSkillEndurance
    level: 1

