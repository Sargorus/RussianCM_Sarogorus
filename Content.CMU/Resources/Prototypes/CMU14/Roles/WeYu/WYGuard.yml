- type: job
  parent: AU14JobWYGuardBase
  id: AU14JobWYGuard
  roundSide: Civilian
  roundForce: WY
  roundProfiles:
  - AU14RoundJobProfileThirdParty
  roundRole: WYGuard
  roundComponents:
  - type: Skills
    skills:
      RMCSkillOverwatch: 1
      RMCSkillFirearms: 2
      RMCSkillCqc: 2
      RMCSkillEndurance: 2
      RMCSkillFireman: 2
      RMCSkillEngineer: 2
      RMCSkillIntel: 1
      RMCSkillVehicles: 1
      RMCSkillPolice: 2
      RMCSkillConstruction: 2
  - type: JobPrefix
    prefix: au14-job-prefix-wyguard
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/cm_job_icons.rsi
      state: weya_goon_standard
  - type: AssignSquad
    whitelist:
      tags:
      - CMUSquadLimaTag

  name: au14-job-name-wysecurityofficer
  description: au14-job-description-wysecurityofficer
  setPreference: true
  ranks:
    AU14RankWYSecurityOfficerChief:
    - !type:RoleTimeRequirement
      role: AU14JobWYGuard
      time: 360000 # 100 hours
    AU14RankWYSecurityOfficerMaster:
    - !type:RoleTimeRequirement
      role: AU14JobWYGuard
      time: 180000 # 50 hours
    AU14RankWYSecurityOfficerSenior:
    - !type:RoleTimeRequirement
      role: AU14JobWYGuard
      time: 86400 # 24 hours
    AU14RankWYSecurityOfficer:
    - !type:RoleTimeRequirement
      role: AU14JobWYGuard
      time: 36000 # 10 hours
    AU14RankWYSecurityOfficerJunior: []
  startingGear: AU14GearWYGuard
  icon: "RMCJobIconPMCGoonStandard"
  requireAdminNotify: false
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 18000 # 5 hours
  - !type:AgeRequirement
    requiredAge: 21
  - !type:TraitsRequirement
    inverted: true
    traits:
    - Epilepsy
    - CMUHeartCondition
    - CMUHemophilia
    - CMUHardOfHearing
    - CMUClaustrophobic
    - CMUFearOfBlood
  joinNotifyCrew: false
  supervisors: au14-job-supervisors-wysecurityleader
  spawnMenuRoleName: au14-spawn-role-name-wy-corporate-goon
  accessGroups:
  - auwy
  - AUPrisonStaff
  roleWeight: 0.25

