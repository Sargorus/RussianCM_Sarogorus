# CMU14: WY PMC overwatch squads. These intentionally have no SquadPMC tag, so
# AssignSquad never puts anyone in them automatically. Kilo and Lima start empty
# and only accept manual transfers from a WeYa overwatch console. Whiskey is the
# default guard squad and has its own tag so WY guard jobs spawn into it.
- type: entity
  parent: SquadBase
  id: CMUSquadWhiskey
  name: Whiskey
  components:
  - type: SquadTeam
    color: "#E67E22"
    background:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: empty
    blacklistedSquadArmor:
    - Helmet
    - Goggles
    - Armor
    - Gloves
    radio: radioWEYU
    minimapBackground:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_pmc
    canSupplyDrop: false
    group: WeYa
    maxRoles: {}
    leaderIcon:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: weya_goon_lead
  - type: Tag
    tags:
    - CMUSquadWhiskeyTag

- type: entity
  parent: SquadBase
  id: CMUSquadKilo
  name: Kilo
  components:
  - type: SquadTeam
    color: "#F39C12"
    background:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: empty
    blacklistedSquadArmor:
    - Helmet
    - Goggles
    - Armor
    - Gloves
    radio: radioWEYU
    minimapBackground:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_pmc
    canSupplyDrop: false
    group: WeYa
    maxRoles: {}
    leaderIcon:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: weya_goon_lead

- type: entity
  parent: SquadBase
  id: CMUSquadLima
  name: Lima
  components:
  - type: SquadTeam
    color: "#F5B041"
    background:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: empty
    blacklistedSquadArmor:
    - Helmet
    - Goggles
    - Armor
    - Gloves
    radio: radioWEYU
    minimapBackground:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_pmc
    canSupplyDrop: false
    group: WeYa
    maxRoles: {}
    leaderIcon:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: weya_goon_lead

- type: Tag
  id: CMUSquadWhiskeyTag
