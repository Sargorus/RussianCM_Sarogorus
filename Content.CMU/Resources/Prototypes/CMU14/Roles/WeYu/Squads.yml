# CMU14: WY overwatch squads. These intentionally have no SquadPMC tag, so
# AssignSquad never puts anyone in them automatically. Security holds the WY
# guards; Staff holds the liaison, his assistant, the scientists and the
# handyman. Membership comes from the per-job AssignSquad tags below, and both
# squads are visible in the WeYa overwatch console.
- type: entity
  parent: SquadBase
  id: CMUSquadSecurity
  name: Security
  components:
  - type: SquadTeam
    color: "#FFA500"
    background:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: empty
    blacklistedSquadArmor:
    - Helmet
    - Goggles
    - Armor
    - Gloves
    radio: radioWEYU
    minimapBackground:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_pmc
    canSupplyDrop: false
    group: WeYa
    maxRoles: {}
    leaderIcon:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: weya_goon_lead
  - type: Tag
    tags:
    - CMUSquadSecurityTag

- type: entity
  parent: SquadBase
  id: CMUSquadStaff
  name: Staff
  components:
  - type: SquadTeam
    color: "#D3D3D3"
    background:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: empty
    blacklistedSquadArmor:
    - Helmet
    - Goggles
    - Armor
    - Gloves
    radio: radioWEYU
    minimapBackground:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_pmc
    canSupplyDrop: false
    group: WeYa
    maxRoles: {}
    leaderIcon:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: weya_scientist
  - type: Tag
    tags:
    - CMUSquadStaffTag

- type: Tag
  id: CMUSquadSecurityTag

- type: Tag
  id: CMUSquadStaffTag
