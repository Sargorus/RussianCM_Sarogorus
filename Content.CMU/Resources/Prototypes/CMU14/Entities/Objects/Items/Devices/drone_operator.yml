- type: entity
  parent: CMBackpackMarine
  id: CMUDroneOperatorChoicePackFilled
  name: drone operator deployment pack
  description: Contains a drone selection kit. Use the kit to choose humanoid drone, gun UGV, or flamer UGV equipment after deployment.
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Back/Backpacks/Marines/tech/jungle-desert-classic.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,29,2
  - type: StorageFill
    contents:
    - id: CMUDronePlatformKit

- type: entity
  parent: BaseItem
  id: CMUDronePlatformKit
  name: drone selection kit
  description: Use this kit to choose one humanoid drone, gun UGV, or flamer UGV assembly package.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Storage/procase_mini.rsi
    state: closed
  - type: Item
    size: Small
  - type: CMUDronePlatformKit
  - type: ActivatableUI
    key: enum.CMUDronePlatformKitUi.Key
    inHandsOnly: false
    verbText: cmu-drone-platform-title
  - type: UserInterface
    interfaces:
      enum.CMUDronePlatformKitUi.Key:
        type: CMUDronePlatformKitBui

- type: entity
  parent: BaseItem
  id: CMUDroneControlTablet
  name: drone control tablet
  description: A ruggedized command tablet used to link and remotely pilot one drone android or tracked combat drone within a short tactical leash.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/command_tablet.rsi
    state: cotablet
  - type: Item
    size: Small
  - type: CMUDroneControlTablet
    range: 30

- type: entity
  parent: CMBackpackMarine
  id: CMUDroneOperatorPackFilled
  name: drone operator field pack
  description: A compact field pack issued with a drone controller, disassembled drone android frame, tools, and swappable drone modules.
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Back/Backpacks/Marines/tech/jungle-desert-classic.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,29,2
  - type: StorageFill
    contents:
    - id: CMUDroneControlTablet
    - id: CMUDroneBodyFrame
    - id: CMUDroneHeadAssembly
    - id: CMUDroneLeftArmAssembly
    - id: CMUDroneRightArmAssembly
    - id: CMUDroneLeftLegAssembly
    - id: CMUDroneRightLegAssembly
    - id: CMUDroneSynthKey
    - id: CMScrewdriver
    - id: CMWrench
    - id: CMWelder
    - id: CMUDroneModuleCombat
    - id: CMUDroneModuleMedical

- type: entity
  parent: BaseItem
  id: CMUDroneBodyFrame
  name: humanoid drone body frame
  description: A bare synthetic torso frame with sealed limb ports and an empty activation socket.
  components:
  - type: ContainerContainer
    containers:
      cmu-drone-frame-parts: !type:Container
        ents: []
        showEnts: False
        occludes: True
  - type: Sprite
    sprite: CMU14/Mobs/DroneAndroid/parts.rsi
    layers:
    - state: torso_m
    - state: head_m
      map: ["head"]
      visible: false
    - state: r_arm
      map: ["right_arm"]
      visible: false
    - state: l_arm
      map: ["left_arm"]
      visible: false
    - state: r_leg
      map: ["right_leg"]
      visible: false
    - state: l_leg
      map: ["left_leg"]
      visible: false
    - state: l_foot
      map: ["left_foot"]
      visible: false
    - state: r_foot
      map: ["right_foot"]
      visible: false
    - state: l_hand
      map: ["left_hand"]
      visible: false
    - state: r_hand
      map: ["right_hand"]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.CMUDroneFrameVisuals.Head:
        head:
          True: { visible: true }
          False: { visible: false }
      enum.CMUDroneFrameVisuals.LeftArm:
        left_arm:
          True: { visible: true }
          False: { visible: false }
        left_hand:
          True: { visible: true }
          False: { visible: false }
      enum.CMUDroneFrameVisuals.RightArm:
        right_arm:
          True: { visible: true }
          False: { visible: false }
        right_hand:
          True: { visible: true }
          False: { visible: false }
      enum.CMUDroneFrameVisuals.LeftLeg:
        left_leg:
          True: { visible: true }
          False: { visible: false }
        left_foot:
          True: { visible: true }
          False: { visible: false }
      enum.CMUDroneFrameVisuals.RightLeg:
        right_leg:
          True: { visible: true }
          False: { visible: false }
        right_foot:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    size: Normal
  - type: CMUDroneFrame
    dronePrototype: CMUDroneAndroid

- type: entity
  parent: CMUDroneBodyFrame
  id: CMUDroneBodyFrameUnarmed
  name: civilian humanoid drone body frame
  description: A bare synthetic torso frame whose control bus is locked out of firearm use. Its limb ports are sealed and its activation socket is empty.
  components:
  - type: CMUDroneFrame
    dronePrototype: CMUDroneAndroidUnarmed

- type: entity
  parent: CMUDroneBodyFrame
  id: CMUDroneBodyFrameCombat
  name: combat humanoid drone body frame
  description: A reinforced synthetic torso frame with a combat-rated control bus. Its limb ports are sealed and its activation socket is empty.
  components:
  - type: CMUDroneFrame
    dronePrototype: CMUDroneAndroidCombat

- type: entity
  abstract: true
  parent: BaseItem
  id: CMUDronePartBase
  name: drone android part
  description: A stripped synthetic assembly part for a drone android.
  components:
  - type: Sprite
    sprite: CMU14/Mobs/DroneAndroid/parts.rsi
  - type: Item
    size: Small

- type: entity
  parent: CMUDronePartBase
  id: CMUDroneHeadAssembly
  name: drone android head
  description: A bare synthetic head assembly with minimal sensor and control hardware.
  components:
  - type: Sprite
    state: head_m
  - type: CMUDroneAssemblyPart
    part: Head

- type: entity
  parent: CMUPartDroneAndroidLeftArm
  id: CMUDroneLeftArmAssembly
  name: drone android left arm
  description: A left arm assembly with exposed actuator bundles. It can be fitted to a drone frame or attached as a replacement limb.
  components:
  - type: Item
    size: Small
  - type: CMUDroneAssemblyPart
    part: LeftArm

- type: entity
  parent: CMUPartDroneAndroidRightArm
  id: CMUDroneRightArmAssembly
  name: drone android right arm
  description: A right arm assembly with exposed actuator bundles. It can be fitted to a drone frame or attached as a replacement limb.
  components:
  - type: Item
    size: Small
  - type: CMUDroneAssemblyPart
    part: RightArm

- type: entity
  parent: CMUPartDroneAndroidLeftLeg
  id: CMUDroneLeftLegAssembly
  name: drone android left leg
  description: A left leg assembly with reinforced knee servos. It can be fitted to a drone frame or attached as a replacement limb.
  components:
  - type: Item
    size: Small
  - type: CMUDroneAssemblyPart
    part: LeftLeg

- type: entity
  parent: CMUPartDroneAndroidRightLeg
  id: CMUDroneRightLegAssembly
  name: drone android right leg
  description: A right leg assembly with reinforced knee servos. It can be fitted to a drone frame or attached as a replacement limb.
  components:
  - type: Item
    size: Small
  - type: CMUDroneAssemblyPart
    part: RightLeg

- type: entity
  parent: BaseItem
  id: CMUDroneSynthKey
  name: drone synth key
  description: A locked synthetic authorization key used to bring a completed drone android frame online.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/synth_token.rsi
    state: coin_synth
  - type: Item
    size: Tiny
  - type: CMUDroneSynthKey

- type: entity
  parent: BaseItem
  id: CMUDroneConfigurationKey
  name: Wey-Yu drone configuration key
  description: A Weyland-Yutani service key that rewrites a drone's faction, radio channels and access permissions from the holder's credentials.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/synth_reset_key.rsi
    state: reset_key
  - type: Item
    size: Tiny
  - type: CMUDroneConfigurationKey

- type: entity
  abstract: true
  parent: BaseItem
  id: CMUDroneModuleBase
  name: drone module
  description: A swappable control module designed for a drone android's internal tool bus.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/module.rsi
    state: std_mod
  - type: Item
    size: Small
  - type: CMUDroneModule

- type: entity
  parent: CMUDroneModuleBase
  id: CMUDroneModuleCombat
  name: drone combat module
  description: A tactical combat module loaded with close-quarters and firearms routines.
  components:
  - type: Sprite
    state: mcontroller
  - type: CMUDroneModule
    skills:
      RMCSkillCqc: 4
      RMCSkillFirearms: 4

- type: entity
  parent: CMUDroneModuleBase
  id: CMUDroneModuleMedical
  name: drone medical module
  description: A medical module loaded with doctor-grade treatment and surgery routines.
  components:
  - type: Sprite
    state: power_mod
  - type: CMUDroneModule
    skills:
      RMCSkillMedical: 4
      RMCSkillSurgery: 4

- type: entity
  parent: CMUDroneModuleBase
  id: CMUDroneModuleEngineering
  name: drone engineering module
  description: An engineering module loaded with construction, engineering, and power loader routines.
  components:
  - type: Sprite
    state: std_mod
  - type: CMUDroneModule
    skills:
      RMCSkillConstruction: 4
      RMCSkillEngineer: 4
      RMCSkillPowerLoader: 2

- type: entity
  parent: CMUDroneModuleBase
  id: CMUDroneModulePolice
  name: drone police module
  description: A police module loaded with law enforcement, endurance, and melee routines. It does not grant firearm authorization.
  components:
  - type: Sprite
    state: std_mod
  - type: CMUDroneModule
    skills:
      RMCSkillPolice: 4
      RMCSkillEndurance: 4
      RMCSkillMeleeWeapons: 4
      RMCSkillCqc: 4
