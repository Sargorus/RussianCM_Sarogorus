- type: entity
  parent: RMCCommunicationsConsoleBase
  id: CMURoboticsOrderConsole
  name: robotics order console
  description: A Weyland-Yutani contract terminal for robotics work. Accept a build or repair order, receive its synthetic transport crates in cargo, attach the printed order slip to a loaded crate, then lower the platform. Orders expire after fifteen minutes.
  components:
  - type: Transform
    anchored: false
    noRot: false
  - type: Anchorable
    flags: [Anchorable, Unanchorable]
  - type: Rotatable
  - type: RemoveComponents
    components:
    - type: WallMount
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal1_old
  - type: InteractionOutline
  - type: CMURoboticsOrderConsole
    buildTargets:
    - prototype: CMUDroneAndroidUnarmed
      reward: 3500
      requiredModules:
      - CMUDroneModuleCare
    - prototype: CMUDroneAndroidCombat
      reward: 4500
      requiredModules:
      - CMUDroneModuleCombat
      - CMUDroneModuleCare
    repairTargets:
    - prototype: CMUDroneAndroidUnarmed
      reward: 2500
      requiredModules:
      - CMUDroneModuleCare
    - prototype: CMUDroneAndroidCombat
      reward: 3000
      requiredModules:
      - CMUDroneModuleCombat
      - CMUDroneModuleCare
    - prototype: CMUWorkingJoeRepair
      reward: 2500
  - type: ActivatableUI
    key: enum.CMURoboticsOrderConsoleUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["AU14AccessCorporateWEYU"]]
  - type: UserInterface
    interfaces:
      enum.CMURoboticsOrderConsoleUiKey.Key:
        type: CMURoboticsOrderConsoleBoundUserInterface
  - type: StaticPrice
    price: 800
