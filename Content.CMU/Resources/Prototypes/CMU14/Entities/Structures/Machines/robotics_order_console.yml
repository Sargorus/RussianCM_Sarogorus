- type: entity
  parent: RMCCommunicationsConsoleBase
  id: CMURoboticsOrderConsole
  name: robotics order console
  description: A Weyland-Yutani contract terminal for robotics work. Accept a build or repair order, then place the finished drone next to the console and submit it.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal1_old
  - type: InteractionOutline
  - type: CMURoboticsOrderConsole
    buildTargets:
    - prototype: CMUDroneAndroidUnarmed
      reward: 500
      requiredModules:
      - CMUDroneModuleCare
    - prototype: CMUDroneAndroidCombat
      reward: 800
      requiredModules:
      - CMUDroneModuleCombat
      - CMUDroneModuleCare
    - prototype: CMUCombatDrone
      reward: 700
    - prototype: CMUFlamerDrone
      reward: 700
    repairTargets:
    - prototype: CMUDroneAndroidUnarmed
      reward: 250
    - prototype: CMUDroneAndroidCombat
      reward: 400
    - prototype: CMUCombatDrone
      reward: 350
    - prototype: CMUFlamerDrone
      reward: 350
  - type: ActivatableUI
    key: enum.CMURoboticsOrderConsoleUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["AU14AccessCorporateWEYU"]]
  - type: UserInterface
    interfaces:
      enum.CMURoboticsOrderConsoleUiKey.Key:
        type: CMURoboticsOrderConsoleBoundUserInterface
  - type: StaticPrice
    price: 800
