- type: entity
  parent:
  - AppearanceDroneAndroid
  - AU14MobWorkingJoe
  id: CMUDroneAndroid
  name: drone android
  description: A stripped-down synthetic drone frame with exposed servos and a sparse combat-rated control bus.
  suffix: CMU14
  components:
  - type: CMUDroneAndroid
    nameDataset: CMUNamesDroneAndroid
    maxNameLength: 24
    followCloseRange: 1
  - type: RemoveComponents
    components:
    - type: WorkingJoeVoice
    - type: IntrinsicRadioReceiver
    - type: IntrinsicRadioTransmitter
    - type: ActiveRadio
  - type: Inventory
    templateId: cmuDroneAndroid
  # AU14MobWorkingJoe is the behavioral parent and also supplies an appearance;
  # explicitly select the drone graph after prototype inheritance is merged.
  - type: InitialBody
    organs:
      Torso: CMUPartDroneAndroidTorso
      Head: CMUPartDroneAndroidHead
      ArmLeft: CMUPartDroneAndroidLeftArm
      ArmRight: CMUPartDroneAndroidRightArm
      HandLeft: CMUPartDroneAndroidLeftHand
      HandRight: CMUPartDroneAndroidRightHand
      LegLeft: CMUPartDroneAndroidLeftLeg
      LegRight: CMUPartDroneAndroidRightLeg
      FootLeft: CMUPartDroneAndroidLeftFoot
      FootRight: CMUPartDroneAndroidRightFoot
      Brain: CMUOrganHumanBrain
      Eyes: CMUOrganHumanEyes
      Lungs: CMUOrganHumanLungs
      Heart: CMUOrganHumanHeart
      Stomach: CMUOrganHumanStomach
      Liver: CMUOrganHumanLiver
      Kidneys: CMUOrganHumanKidneys
  - type: HumanoidProfile
    species: DroneAndroid
    voice: AU14WorkingJoeSounds
  - type: Synth
    canUseGuns: true
    removeComponents: CMUDroneAndroidRemoveComponents
    generation: cmu-species-drone-android-generation
    critThreshold: 74
    deadThreshold: 80
    repairTime: 5
    selfRepairTime: 9999
    hideGeneration: true
    useHumanHealthIcons: true
    hideXenoSynthIcon: true
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
  - type: RMCInnateSlowdown
    slowdown: 1.15
  - type: NoClothingSlowdown
    walkModifier: 1
    sprintModifier: 1
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepBorg
  - type: Skills
    skills: {}
  - type: HTN
    rootTask:
      task: CMUDroneFollowCompound
    enabled: false
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/CMU14/Interface/au14govforjobicons.rsi
      state: rifleman
  - type: UserIFF
    factions:
    - GOVFOR
  - type: NpcFactionMember
    factions:
    - GOVFOR
  - type: GrantMarineIcons
    factions:
    - UNMC

# Robotics fabricator variants. The unarmed frame cannot use guns even if a
# combat module is installed; the combat frame has weapon skills and armour.
- type: entity
  parent: CMUDroneAndroid
  id: CMUDroneAndroidUnarmed
  name: unarmed drone android
  description: A stripped-down synthetic drone frame with exposed servos. Its control bus is deliberately locked out of firearm use.
  suffix: CMU14, Unarmed
  components:
  - type: Synth
    canUseGuns: false
  - type: CMUDroneAndroid
    supportsCombatModule: false

- type: entity
  parent: CMUDroneAndroid
  id: CMUDroneAndroidCombat
  name: combat drone android
  description: A reinforced synthetic drone frame with a combat-rated control bus, weapon routines, and a layer of corporate armour.
  suffix: CMU14, Combat
  components:
  - type: Synth
    canUseGuns: true
  - type: Skills
    skills:
      RMCSkillCqc: 4
      RMCSkillFirearms: 4
      RMCSkillMeleeWeapons: 4
      RMCSkillSmartGun: 4
  - type: CMArmor
    melee: 30
    bullet: 20
    bio: 10
    explosionArmor: 10

# Repair-order targets. They spawn with random missing limbs and randomized
# burn and brute damage, and no control module installed.
- type: entity
  parent: CMUDroneAndroidUnarmed
  id: CMUDroneAndroidUnarmedRepair
  name: damaged unarmed drone android
  suffix: CMU14, Repair target
  components:
  - type: CMUHumanMedical
  - type: CMURoboticsDamagedBody

- type: entity
  parent: CMUDroneAndroidCombat
  id: CMUDroneAndroidCombatRepair
  name: damaged combat drone android
  suffix: CMU14, Repair target
  components:
  - type: CMUHumanMedical
  - type: CMURoboticsDamagedBody

# Stable repair-order variants. Their damage is pre-rolled when the order is
# generated and applied when the crate is delivered, so the displayed reward
# never changes after the order is accepted.
- type: entity
  parent: CMUDroneAndroidUnarmedRepair
  id: CMUDroneAndroidUnarmedRepairOrder
  categories: [ HideSpawnMenu ]
  components:
  - type: CMURoboticsDamagedBody
    randomizeOnMapInit: false

- type: entity
  parent: CMUDroneAndroidCombatRepair
  id: CMUDroneAndroidCombatRepairOrder
  categories: [ HideSpawnMenu ]
  components:
  - type: CMURoboticsDamagedBody
    randomizeOnMapInit: false

- type: entity
  parent: AppearanceDroneAndroid
  id: CMUDroneAndroidDummy
  categories: [ HideSpawnMenu ]

- type: entity
  parent: RMCSynthRemoveComponents
  id: CMUDroneAndroidRemoveComponents
  categories: [ HideSpawnMenu ]
  components:
  - type: MindContainer
  - type: SSDIndicator

- type: entity
  parent: BaseItem
  id: CMURuinedDroneCore
  name: ruined drone core
  description: The scorched control core from a destroyed drone android. It is only useful as evidence now.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/module.rsi
    state: mainboard
  - type: Item
    size: Small
  - type: CMURuinedDroneCore
