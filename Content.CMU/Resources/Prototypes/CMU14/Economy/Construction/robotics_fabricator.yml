# Weyland-Yutani robotics fabricator and its drone-part recipes.
#
# The fabricator is sold through corporate cargo. It is movable (wrench to
# anchor/unanchor), needs a WL-6 universal fuel cell to power its UI, and only
# opens for personnel with Research 3.

- type: latheCategory
  id: CMURoboticsSynthLimbs
  name: cmu-lathe-category-robotics-synth-limbs

- type: latheCategory
  id: CMURoboticsWorkingJoeLimbs
  name: cmu-lathe-category-robotics-working-joe-limbs

- type: latheCategory
  id: CMURoboticsProsthetics
  name: cmu-lathe-category-robotics-prosthetics

- type: latheCategory
  id: CMURoboticsComponents
  name: cmu-lathe-category-robotics-components

- type: entity
  parent: CMAutolathe
  id: CMURoboticsFabricator
  name: robotics fabricator
  description: A Weyland-Yutani fabricator for android frames, limbs, control tablets, modules and activation keys. It needs a WL-6 universal fuel cell and a trained roboticist.
  components:
  - type: Transform
    anchored: false
  - type: Anchorable
    flags: [Anchorable, Unanchorable]
  - type: Lathe
    idleState: autolathe
    runningState: autolathe_n
    producingSound: /Audio/_RMC14/Machines/print.ogg
    staticPacks:
    - CMURoboticsFabricatorRecipes
  - type: MaterialStorage
    storage: {}
    whitelist:
      tags:
      - Metal
      - RMCGlass
      - Plastic
  - type: CMURoboticsFabricator
  - type: StaticPrice
    price: 1500

