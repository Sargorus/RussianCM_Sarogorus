# Dedicated drone android limbs. They share the drone parts sprite and the
# DroneAndroid limb family, so surgery accepts them on drone androids but
# rejects them on humans, synths and Working Joes. Do not reuse the robotic
# prosthetic prototypes (robotic.yml) for drones.
- type: entity
  parent: [ OrganBaseArmLeft, PartSilicon, CMUPartDroneAndroidVisual ]
  id: CMUPartDroneAndroidLeftArm
  name: drone android left arm
  suffix: CMU
  components:
  - type: BodyPart
    partType: Arm
    symmetry: Left
  - type: Sprite
    sprite: CMU14/Mobs/DroneAndroid/parts.rsi
    state: l_arm
    drawdepth: Items
  - type: Icon
    sprite: CMU14/Mobs/DroneAndroid/parts.rsi
    state: l_arm
  - type: BodyPartHealth
    max: 80
    current: 80
    severanceThreshold: 90
  - type: CMURoboticLimb
    prosthetic: false
  - type: VisualOrgan
    data:
      sprite: CMU14/Mobs/DroneAndroid/parts.rsi
      state: l_arm

