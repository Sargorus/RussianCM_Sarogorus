# Robotic prosthetics used by the prosthetic-limb character trait. Drone
# android limbs are separate prototypes (drone_limbs.yml) so a drone can never
# be repaired with a human prosthetic and a human cannot receive drone parts.
- type: entity
  id: CMUPartProstheticVisual
  abstract: true
  components:
  - type: Sprite
    sprite: CMU14/Mobs/DroneAndroid/parts.rsi
  - type: VisualOrgan
    data:
      sprite: CMU14/Mobs/DroneAndroid/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: DroneAndroid

- type: entity
  parent: [ OrganBaseArmLeft, PartSilicon, CMUPartProstheticVisual ]
  id: CMUPartRoboticLeftArm
  name: left robotic prosthetic arm
  suffix: CMU
  components:
  - type: BodyPart
    partType: Arm
    symmetry: Left
  - type: Sprite
    sprite: CMU14/Mobs/DroneAndroid/parts.rsi
    state: l_arm
    drawdepth: Items
  - type: Icon
    sprite: CMU14/Mobs/DroneAndroid/parts.rsi
    state: l_arm
  - type: BodyPartHealth
    max: 80
    current: 80
    severanceThreshold: 90
  - type: CMURoboticLimb
  - type: VisualOrgan
    data:
      sprite: CMU14/Mobs/DroneAndroid/parts.rsi
      state: l_arm

